name: Cloud adapter
on:
  pull_request:
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud.yml'
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run check
